[options]
; Database settings - configured via environment variables
db_host = False
db_port = 5432
db_user = odoo
db_password = False
db_name = odoo

; Addons path
addons_path = /opt/odoo/addons,/opt/odoo/enterprise

; Admin password (use ADMIN_PASSWD env var in Cloud Run)
admin_passwd = False

; Server settings
http_port = 8069
proxy_mode = True
workers = 2

; Logging - use stdout for Cloud Run
log_level = info
logfile = False

; Performance
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 600
limit_time_real = 1200

; Data directory
data_dir = /var/lib/odoo

; Session settings
max_cron_threads = 1

; Security - allow database selection for initial setup
list_db = True
