name: Deploy to Cloud Run

on:
  push:
    branches:
      - 19.0
  workflow_dispatch:

env:
  PROJECT_ID: odoo-erp-prod
  REGION: asia-northeast1
  SERVICE_NAME: odoo
  REPOSITORY: odoo
  IMAGE: odoo

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            -f Dockerfile \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          flags: |
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:odoo-db
            --vpc-connector=odoo-vpc-connector
            --vpc-egress=private-ranges-only
            --set-secrets=ADMIN_PASSWD=odoo-admin-password:latest,DB_PASSWORD=odoo-db-password:latest
            --set-env-vars=DB_HOST=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:odoo-db,DB_NAME=odoo_new,DB_USER=odoo
            --service-account=odoo-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --memory=2Gi
            --cpu=2
            --min-instances=1
            --max-instances=5
            --port=8069
            --allow-unauthenticated

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
