version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./ops/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - odoo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass odoo_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - odoo_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Odoo Application
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DATABASE=odoo
      - REDIS_HOST=redis
      - REDIS_PASSWORD=odoo_redis_password
    volumes:
      - ./addons:/opt/odoo/addons
      - ./odoo:/opt/odoo/odoo
      - ./ops/config:/etc/odoo
      - odoo_data:/opt/odoo/var
      - ./var/logs:/opt/odoo/var/log
      - ./var/backups:/opt/odoo/var/backups
    ports:
      - "127.0.0.1:8069:8069"  # Only accessible from host for nginx proxy
    networks:
      - odoo_network
    command: >
      python3 odoo-bin
      -c /etc/odoo/odoo.conf
      --dev=reload,qweb,werkzeug,xml
      --log-level=debug
      --logfile=/opt/odoo/var/log/odoo.log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Note: Nginx is configured to run on the VPS host, not in Docker
  # See docs/Nginx_HOST_SETUP.md for host nginx configuration

  # Celery Worker for Background Tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DATABASE=odoo
      - REDIS_HOST=redis
      - REDIS_PASSWORD=odoo_redis_password
    volumes:
      - ./addons:/opt/odoo/addons
      - ./odoo:/opt/odoo/odoo
      - ./ops/config:/etc/odoo
      - odoo_data:/opt/odoo/var
    command: celery -A odoo worker --loglevel=info
    networks:
      - odoo_network
    restart: unless-stopped

  # Celery Beat for Scheduled Tasks
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DATABASE=odoo
      - REDIS_HOST=redis
      - REDIS_PASSWORD=odoo_redis_password
    volumes:
      - ./addons:/opt/odoo/addons
      - ./odoo:/opt/odoo/odoo
      - ./ops/config:/etc/odoo
      - odoo_data:/opt/odoo/var
    command: celery -A odoo beat --loglevel=info
    networks:
      - odoo_network
    restart: unless-stopped

  # Flower for Celery Monitoring
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=odoo_redis_password
    ports:
      - "5555:5555"
    command: celery -A odoo flower --port=5555
    networks:
      - odoo_network
    restart: unless-stopped

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - odoo_network
    restart: unless-stopped

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/docker/grafana/provisioning:/etc/grafana/provisioning
      - ./ops/docker/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - odoo_network
    restart: unless-stopped

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - odoo_network
    restart: unless-stopped

  # Elasticsearch for Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - odoo_network
    restart: unless-stopped

  # Kibana for Elasticsearch Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - odoo_network
    restart: unless-stopped

  # MinIO for Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    networks:
      - odoo_network
    restart: unless-stopped

  # Test Database
  test_db:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo_test
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    networks:
      - odoo_network
    profiles:
      - testing

  # Test Runner
  test_runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - test_db
    environment:
      - HOST=test_db
      - USER=odoo
      - PASSWORD=odoo
      - DATABASE=odoo_test
      - TESTING=true
    volumes:
      - ./addons:/opt/odoo/addons
      - ./odoo:/opt/odoo/odoo
      - ./tests:/opt/odoo/tests
      - ./ops/config:/etc/odoo
      - ./var/test_results:/opt/odoo/test_results
    command: >
      bash -c "
        python3 -m pytest tests/ -v
        --cov=odoo
        --cov-report=html:/opt/odoo/test_results/htmlcov
        --cov-report=xml:/opt/odoo/test_results/coverage.xml
        --junitxml=/opt/odoo/test_results/junit.xml
        --html=/opt/odoo/test_results/report.html
        --self-contained-html
      "
    networks:
      - odoo_network
    profiles:
      - testing

volumes:
  postgres_data:
  test_postgres_data:
  redis_data:
  odoo_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  minio_data:

networks:
  odoo_network:
    driver: bridge




