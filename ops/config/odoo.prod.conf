[options]
; This is the password that allows database operations:
admin_passwd = CHANGE_THIS_SECURE_PASSWORD
db_host = psql
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo
db_template = template0
db_sslmode = prefer
db_maxconn = 64

; Server options
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 0

; Logging
log_level = warning
log_handler = :WARNING
logfile = /opt/odoo/var/log/odoo.log
data_dir = /opt/odoo/var
log_db_level = warning
syslog = False

; Addons
addons_path = /opt/odoo/addons,/mnt/extra-addons
without_demo = True
load_language = en_US

; Security - IMPORTANT for production behind reverse proxy
list_db = False
proxy_mode = True

; Performance
unaccent = True

; Email - Configure for your SMTP provider
email_from = noreply@yourdomain.com
smtp_server = smtp.yourdomain.com
smtp_port = 587
smtp_ssl = True
smtp_user = your_smtp_user
smtp_password = your_smtp_password

; Production settings
dev_mode = False
test_enable = False
