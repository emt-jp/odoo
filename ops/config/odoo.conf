[options]
; This is the password that allows database operations:
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo
db_template = template0
db_sslmode = prefer
db_maxconn = 64
db_maxconn_gevent = False

; Server options
http_interface = 0.0.0.0
http_port = 8069
longpolling_port = 8072
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 0

; Logging
log_level = info
log_handler = :INFO
logfile = /opt/odoo/var/log/odoo.log
data_dir = /opt/odoo/var
log_db = False
log_db_level = warning
syslog = False

; Addons
addons_path = /opt/odoo/addons
upgrade_path = /opt/odoo/upgrade
without_demo = False
load_language = en_US

; Security
list_db = True
proxy_mode = False
secure_cert_file = /etc/odoo/server.cert
secure_pkey_file = /etc/odoo/server.pkey

; Performance
unaccent = True
geoip_database = /usr/share/GeoIP/GeoLite2-City.mmdb

; Email
email_from = odoo@localhost
smtp_server = mailhog
smtp_port = 1025
smtp_ssl = False
smtp_user = False
smtp_password = False

; Cache
cache_redis = True
redis_host = redis
redis_port = 6379
redis_password = odoo_redis_password
redis_dbindex = 0

; Enterprise features
enterprise_mode = True
license_key = TRIAL-0000-0000-0000

; Testing
testing = False
test_enable = False
test_file = False
test_tags = False
stop_after_init = False

; Development
dev_mode = reload,qweb,werkzeug,xml
auto_reload = True




