[options]
; This is the password that allows database operations:
admin_passwd = admin
db_host = psql
db_port = 5432
db_user = odoo
db_password = uGajfshoU4YSvpRWoF9uNBtGdDBNI
db_name = odoo
db_template = template0
db_sslmode = prefer
db_maxconn = 64

; Server options
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 0

; Logging
log_level = info
log_handler = :INFO
logfile = /opt/odoo/var/log/odoo.log
data_dir = /opt/odoo/var
log_db_level = warning
syslog = False

; Addons
; Match remote structure: /mnt/extra-addons for custom addons
; Also include core Odoo addons
addons_path = /opt/odoo/addons,/mnt/extra-addons
without_demo = False
load_language = en_US

; Security
list_db = True
proxy_mode = False

; Performance
unaccent = True

; Email
email_from = odoo@localhost
smtp_server = mailhog
smtp_port = 1025
smtp_ssl = False

; Testing
test_enable = False
test_file = False
test_tags = False
stop_after_init = False

; Development
dev_mode = reload,qweb,werkzeug,xml




