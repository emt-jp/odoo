server {
    listen 443 ssl http2;
    server_name nihonrice.com cms.nihonrice.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/nihonrice.pem;
    ssl_certificate_key /etc/nginx/ssl/nihonrice.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Standard HTTP proxying
    location / {
        proxy_pass http://127.0.0.1:$upstream_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket proxying (Different port per host)
    location /websocket {
        proxy_pass http://127.0.0.1:$websocket_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name nihonrice.com cms.nihonrice.com;

    location / {
        return 301 https://$host$request_uri;
    }
}
