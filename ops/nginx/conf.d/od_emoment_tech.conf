# Upstream blocks for better reliability
upstream odoo_backend {
    server 127.0.0.1:8069;
}

upstream odoo_longpolling {
    server 127.0.0.1:8072;
}

map $host $upstream_port {
    default 8069;  # Default to Odoo port
    emoment.tech 3000;
    rm.emoment.tech 8066;
    mm.emoment.tech 8065;
    od.emoment.tech 8069;
    nihonrice.com 3002;
    www.nihonrice.com 3002;
    cms.nihonrice.com 1338;
    emoment.io 3044;
    www.emoment.io 3044;
}

map $host $websocket_port {
    default 8072;  # Default to Odoo longpolling port
    od.emoment.tech 8072;
    #rm.emoment.tech 8073;
    #mm.emoment.tech 8074;
}

server {
    listen 443 ssl http2 default_server;
    server_name od.emoment.tech emoment.tech rm.emoment.tech mm.emoment.tech _; 

    # SSL Configuration (Cloudflare Origin Certificate)
    ssl_certificate /etc/nginx/ssl/emoment.tech.pem;
    ssl_certificate_key /etc/nginx/ssl/emoment.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logging for debugging
    access_log /var/log/nginx/od_emoment_tech_access.log;
    error_log /var/log/nginx/od_emoment_tech_error.log warn;

    # Standard HTTP proxying
    location / {
        # Debug: Log the upstream port being used
        access_log /var/log/nginx/od_emoment_tech_access.log;
        
        # Try upstream block first (more reliable than variable)
        proxy_pass http://odoo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket proxying (Different port per host)
    location /websocket {
        proxy_pass http://127.0.0.1:$websocket_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Long polling for Odoo
    location /longpolling {
        proxy_pass http://odoo_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name emoment.tech rm.emoment.tech mm.emoment.tech od.emoment.tech;

    location / {
        return 301 https://$host$request_uri;
    }
}

