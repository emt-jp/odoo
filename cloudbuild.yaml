# Cloud Build configuration for Odoo
substitutions:
  _REGION: asia-northeast1
  _SERVICE_NAME: odoo
  _CLOUD_SQL_INSTANCE: ${PROJECT_ID}:${_REGION}:odoo-db

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/odoo:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/odoo:latest'
      - '-f'
      - 'docker/Dockerfile'
      - '.'

  # Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/odoo:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/odoo:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/odoo:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--add-cloudsql-instances'
      - '${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars'
      - 'DB_HOST=/cloudsql/${_CLOUD_SQL_INSTANCE}'
      - '--set-secrets'
      - 'ADMIN_PASSWD=odoo-admin-password:latest,DB_PASSWORD=odoo-db-password:latest'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'
      - '--port'
      - '8069'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/${PROJECT_ID}/odoo:${SHORT_SHA}'
  - 'gcr.io/${PROJECT_ID}/odoo:latest'

timeout: 1800s
